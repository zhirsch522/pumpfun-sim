name: fetch stock data (one-shot)
# Downloads free daily ETF prices once and commits them to this branch. Paper research only.
on:
  push:
    branches: [stock-data]
    paths: [".github/workflows/fetch-stock-data.yml", "fetch_data.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas
      - run: python fetch_data.py
      - run: |
          git config user.name "stock-data"; git config user.email "stock-data@users.noreply.github.com"
          git add data; git commit -qm "ETF daily prices"; git push -q
